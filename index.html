<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Español con Valeria</title><meta name="description" content="Интерактивные упражнения по испанскому языку"><link rel="stylesheet" href="style.css"></head><body data-view="home"><div id="app"></div><script src="app.js"></script><script>
(function(){
  const grid=document.querySelector('.grid');
  if(!grid)return;
  const cards=[
    ['adonde-lugares/','🚶','#7d3534','¿Adónde?','Тренируй ответы al parque, a la estación и a casa без глаголов'],
    ['estar-formas-lugares/','📍','#c78a37','Estar: формы и местонахождение','Тренируй estoy, estás, está, estamos, estáis, están и говори, где находятся люди'],
    ['ortografia-fonetica/','🎧','#b05d39','Как пишется слово?','Слушай слово и выбирай правильное написание: CE/CI, QUE/QUI, GUE/GUI и GÜE/GÜI'],
    ['palabra-intrusa-fonetica/','🕵️','#356c68','Palabra intrusa','Найди лишнее слово в каждой строке и объясни правило чтения'],
    ['pronombres/','👥','#7c3aed','Местоимения','Личные местоимения: кто это, лишнее слово, группы и логические ловушки'],
    ['la-familia-de-ana/','📖','#d97706','La familia de Ana','Прочитай текст, выучи новые слова и ответь на вопросы'],
    ['elige-y-explica/','💬','#168b78','Elige y explica','Выбирай варианты и тренируй полные ответы в настоящем времени'],['repaso/','✦','#7d3534','Repaso A1','Смешанное повторение: формы, слова и короткие фразы']
  ];
  cards.forEach(([href,ico,color,title,description])=>{const card=document.createElement('a');card.className='card';card.href='/espanol-con-valeria/'+href;card.innerHTML='<span class="ico" style="background:'+color+'">'+ico+'</span><small>Интерактивное задание</small><h2>'+title+'</h2><p>'+description+'</p><span class="open">Открыть →</span>';grid.appendChild(card)});
})();
</script></body></html>
